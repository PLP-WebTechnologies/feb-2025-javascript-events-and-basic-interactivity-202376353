<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Website</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the Colors Website</h1>
    </header>
    <main>
        <section id="color-picker">
            <h2>Pick a Color</h2>
            <input type="color" id="colorInput">
            <button id="applyColor">Choose Color</button>
        </section>
        <section id="interactive-section">
            <h2>Interactive Elements</h2>
            <button id="changeTextButton">Change Text</button>
            <div id="textContainer">Love colors😁?</div>
        </section>
        <section id="form-section">
            <h2>Contact Us</h2>
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" required minlength="8">
                <button type="submit">Submit</button>
            </form>
            <div id="formFeedback"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Beauty in Colors by Sino❤❤</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
